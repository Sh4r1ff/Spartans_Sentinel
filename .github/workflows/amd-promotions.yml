name: AMD Gaming Promotions

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes. GitHub may delay scheduled jobs by a few minutes.
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch AMD promotions and update RSS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m amd_monitor.monitor

      - name: Publish changes
        run: |
          git config user.name "amd-promotions-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/
          if git diff --cached --quiet; then
            echo "No file changes."
          else
            git commit -m "Update AMD Gaming promotions"
            git push
          fi
